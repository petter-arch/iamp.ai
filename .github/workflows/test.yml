name: Test news pipeline
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in *.mjs *.cjs; do node --check "$file"; done
      - name: Test with simulated API responses
        run: node --test *.test.mjs *.test.cjs
